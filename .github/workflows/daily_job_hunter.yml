name: Daily Remote Tourism Job Hunter

on:
  schedule:
    # Runs every day at 07:00 UTC (09:00 AM Cairo Time)
    - cron: '0 7 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  hunt-jobs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Remote Job Discovery & Telegram Dispatch
        run: |
          python fetch_verified_remote_jobs.py

      - name: Commit and Push Updated Reports
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add daily_job_reports/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update daily remote jobs [skip ci]" && git push)
